<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines - Jeu de Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            align-items: start;
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0f3460;
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .control-title {
            color: #00d4ff;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            display: block;
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .control-value {
            background: rgba(15, 52, 96, 0.5);
            border: 1px solid #0f3460;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.3em;
            font-weight: bold;
            color: #00d4ff;
            text-align: center;
        }

        .control-input {
            width: 100%;
            padding: 10px;
            background: rgba(15, 52, 96, 0.5);
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #00d4ff;
            font-size: 1em;
            font-weight: bold;
        }

        select.control-input,
        input.control-input {
            cursor: pointer;
        }

        .control-input option {
            background: #1a1a2e;
            color: #00d4ff;
            padding: 10px;
        }

        .start-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .start-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.4);
        }

        .start-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .cashout-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b00 0%, #ff9500 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            margin-top: 10px;
            display: none;
        }

        .cashout-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 0, 0.4);
        }

        .cashout-button.show {
            display: block;
        }

        .game-area {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0f3460;
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .game-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .game-stat {
            background: rgba(15, 52, 96, 0.5);
            border: 1px solid #0f3460;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00d4ff;
        }

        .stat-value.winning {
            color: #00ff00;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #0f3460 0%, #1a5a7a 100%);
            border: 2px solid #0f3460;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            color: #00d4ff;
            transition: all 0.3s;
            user-select: none;
            position: relative;
        }

        .cell:hover:not(.revealed) {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
        }

        .cell.revealed {
            cursor: default;
        }

        .cell.safe {
            background: linear-gradient(135deg, #0d6949 0%, #0fa575 100%);
            border-color: #0fa575;
            color: #fff;
        }

        .cell.mine {
            background: linear-gradient(135deg, #8b0000 0%, #ff0000 100%);
            border-color: #ff0000;
            animation: pulse 0.5s;
        }

        .cell.mine::before {
            content: '💣';
            font-size: 1.5em;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
        }

        .message.error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
        }

        .game-status {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            display: none;
            font-size: 1.5em;
            font-weight: bold;
        }

        .game-status.show {
            display: block;
        }

        .game-status.won {
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #00ff00;
            color: #00ff00;
        }

        .game-status.lost {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            color: #ff0000;
        }

        .multiplier-display {
            font-size: 2.5em;
            color: #00d4ff;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .control-panel {
                max-width: 100%;
            }

            .grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Panel de contrôle -->
        <div class="control-panel">
            <div class="control-title">⚙️ Contrôles</div>

            <div class="control-group">
                <label class="control-label">Solde:</label>
                <div class="control-value" id="balance">-</div>
            </div>

            <div class="control-group">
                <label class="control-label">Mise:</label>
                <input type="number" id="bet-amount" class="control-input" value="100" min="1" max="10000">
            </div>

            <div class="control-group">
                <label class="control-label">Difficult (Mines):</label>
                <select id="difficulty" class="control-input">
                    <option value="1">Facile (1 mine)</option>
                    <option value="12" selected>Moyen (12 mines)</option>
                    <option value="24">Difficile (24 mines)</option>
                </select>
            </div>

            <button class="start-button" id="start-btn">Démarrer le jeu</button>
            <button class="cashout-button" id="cashout-btn">Encaisser</button>
        </div>

        <!-- Zone de jeu -->
        <div class="game-area">
            <div id="message" class="message"></div>
            <div class="multiplier-display" id="multiplier" style="display: none;">×<span>1.00</span></div>

            <div class="game-header">
                <div class="game-stat">
                    <div class="stat-label">Cellules révélées</div>
                    <div class="stat-value" id="cells-revealed">0</div>
                </div>
                <div class="game-stat">
                    <div class="stat-label">Gains potentiels</div>
                    <div class="stat-value winning" id="potential-winnings">0.00</div>
                </div>
            </div>

            <div class="grid" id="game-grid">
                <!-- Grille générée par JavaScript -->
            </div>

            <div id="game-status" class="game-status"></div>
        </div>
    </div>

    <script>
        let currentGame = null;
        let gameActive = false;
        const apiBase = '/api/golitep';

        // Récupérer le token CSRF
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        const csrftoken = getCookie('csrftoken');

        // Mettre à jour le solde
        async function updateBalance() {
            try {
                const response = await fetch('/api/wallet/balance/');
                if (!response.ok) throw new Error('Failed to fetch balance');
                const data = await response.json();
                document.getElementById('balance').textContent = parseFloat(data.balance).toLocaleString('fr-FR', { 
                    minimumFractionDigits: 2, 
                    maximumFractionDigits: 2 
                });
            } catch (error) {
                console.error('Erreur solde:', error);
                document.getElementById('balance').textContent = 'Erreur';
            }
        }

        // Afficher un message
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            if (!text) {
                messageEl.classList.remove('show');
                return;
            }
            messageEl.textContent = text;
            messageEl.className = `message ${type} show`;
        }

        // Générer la grille visuelle
        function generateGrid() {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.cell = i;
                cell.textContent = '';
                cell.addEventListener('click', () => revealCell(i));
                grid.appendChild(cell);
            }
        }

        // Démarrer une partie
        document.getElementById('start-btn').addEventListener('click', async () => {
            const betAmount = document.getElementById('bet-amount').value;
            const minesCount = document.getElementById('difficulty').value;

            if (!betAmount || betAmount <= 0) {
                showMessage('Veuillez entrer une mise valide', 'error');
                return;
            }

            try {
                const response = await fetch(`${apiBase}/games/start_game/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken,
                    },
                    body: JSON.stringify({
                        bet_amount: betAmount,
                        mines_count: minesCount
                    })
                });

                if (response.ok) {
                    currentGame = await response.json();
                    gameActive = true;
                    generateGrid();
                    updateDisplay();
                    document.getElementById('start-btn').disabled = true;
                    document.getElementById('cashout-btn').classList.add('show');
                    document.getElementById('difficulty').disabled = true;
                    document.getElementById('bet-amount').disabled = true;
                    showMessage(`Partie commencée! ${minesCount} mines à éviter.`, 'success');
                    document.getElementById('multiplier').style.display = 'block';
                } else {
                    const error = await response.json();
                    showMessage(error.error || 'Erreur au démarrage', 'error');
                }
            } catch (error) {
                showMessage('Erreur au démarrage', 'error');
                console.error(error);
            }
            updateBalance();
        });

        // Révéler une cellule
        async function revealCell(cellNumber) {
            if (!gameActive || !currentGame) return;

            try {
                const response = await fetch(`${apiBase}/games/${currentGame.id}/reveal/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken,
                    },
                    body: JSON.stringify({ cell: cellNumber })
                });

                const result = await response.json();

                if (response.ok) {
                    const cell = document.querySelector(`[data-cell="${cellNumber}"]`);
                    
                    if (result.hit_mine) {
                        cell.classList.add('revealed', 'mine');
                        gameActive = false;
                        showMessage('💣 MINE! Partie perdue!', 'error');
                        document.getElementById('game-status').className = 'game-status show lost';
                        document.getElementById('game-status').textContent = '💣 PARTIE PERDUE! 💣';
                        document.getElementById('cashout-btn').classList.remove('show');
                        document.getElementById('start-btn').disabled = false;
                        document.getElementById('difficulty').disabled = false;
                        document.getElementById('bet-amount').disabled = false;
                        revealAllMines();
                    } else {
                        // Récupérer l'état à jour du jeu depuis le serveur
                        const gameResponse = await fetch(`${apiBase}/games/${currentGame.id}/`);
                        if (gameResponse.ok) {
                            currentGame = await gameResponse.json();
                        }
                        
                        cell.classList.add('revealed', 'safe');
                        // Afficher le multiplicateur ACTUEL (mis à jour)
                        cell.textContent = parseFloat(currentGame.current_multiplier).toFixed(2) + 'x';
                        updateDisplay();
                    }
                } else {
                    showMessage(result.error || 'Erreur', 'error');
                }
            } catch (error) {
                showMessage('Erreur révélation', 'error');
                console.error(error);
            }
        }

        // Encaisser les gains
        document.getElementById('cashout-btn').addEventListener('click', async () => {
            if (!gameActive || !currentGame) return;

            try {
                const response = await fetch(`${apiBase}/games/${currentGame.id}/cashout/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrftoken,
                    }
                });

                if (response.ok) {
                    currentGame = await response.json();
                    gameActive = false;
                    
                    document.getElementById('game-status').className = 'game-status show won';
                    document.getElementById('game-status').textContent = `🎉 GAGNÉ! +${currentGame.winnings}! 🎉`;
                    
                    document.getElementById('cashout-btn').classList.remove('show');
                    document.getElementById('start-btn').disabled = false;
                    document.getElementById('difficulty').disabled = false;
                    document.getElementById('bet-amount').disabled = false;
                    
                    showMessage(`Encaissé ${currentGame.winnings}!`, 'success');
                    updateBalance();
                } else {
                    const error = await response.json();
                    showMessage(error.error || 'Erreur', 'error');
                }
            } catch (error) {
                showMessage('Erreur encaissement', 'error');
                console.error(error);
            }
        });

        // Mettre à jour l'affichage
        function updateDisplay() {
            if (currentGame) {
                document.getElementById('cells-revealed').textContent = currentGame.cells_revealed;
                const multiplierValue = parseFloat(currentGame.current_multiplier).toFixed(2);
                document.getElementById('multiplier').querySelector('span').textContent = multiplierValue;
                const potentialWinnings = (parseFloat(currentGame.bet_amount) * parseFloat(multiplierValue)).toFixed(2);
                document.getElementById('potential-winnings').textContent = potentialWinnings;
                
                console.log('Affichage mis à jour:', {
                    cells_revealed: currentGame.cells_revealed,
                    multiplier: multiplierValue,
                    potential_winnings: potentialWinnings
                });
            }
        }

        // Mettre à jour l'état du jeu
        async function updateGameState() {
            updateDisplay();
        }

        // Révéler toutes les mines (après perte)
        function revealAllMines() {
            if (!currentGame) return;
            currentGame.grid.forEach(mineCell => {
                const cell = document.querySelector(`[data-cell="${mineCell}"]`);
                if (cell && !cell.classList.contains('revealed')) {
                    cell.classList.add('revealed', 'mine');
                }
            });
        }

        // Initialiser au chargement
        window.addEventListener('load', () => {
            generateGrid();
            updateBalance();
        });
    </script>
</body>
</html>
