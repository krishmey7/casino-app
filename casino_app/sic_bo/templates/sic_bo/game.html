<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sic Bo - Jeu de Casino</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .header-info {
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .info-item {
            padding: 10px 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }
        .info-item strong { color: #00d4ff; }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 30px;
        }
        .game-section {
            background: rgba(15, 52, 96, 0.8);
            border: 2px solid #0f3460;
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        .game-title {
            font-size: 1.3em;
            margin-bottom: 25px;
            color: #00d4ff;
        }
        .dice-display {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }
        .dice {
            display: inline-block;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            border: 3px solid #0f3460;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: #000;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .total-display {
            text-align: center;
            font-size: 1.3em;
            color: #00d4ff;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
        }
        .result-message {
            text-align: center;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
        }
        .result-win {
            background: rgba(40, 167, 69, 0.3);
            border: 2px solid #28a745;
            color: #90EE90;
        }
        .result-lose {
            background: rgba(220, 53, 69, 0.3);
            border: 2px solid #dc3545;
            color: #ff6b6b;
        }
        .control-panel {
            background: rgba(15, 52, 96, 0.8);
            border: 2px solid #0f3460;
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            height: fit-content;
        }
        .control-title {
            color: #00d4ff;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-label {
            display: block;
            color: #ccc;
            margin-bottom: 8px;
            font-size: 0.85em;
        }
        input[type="number"], select {
            width: 100%;
            padding: 10px;
            background: #1a3a52;
            border: 2px solid #0f3460;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95em;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.9em;
        }
        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #0056b3, #003580);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.4);
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .error-message {
            color: #ff6b6b;
            font-size: 0.85em;
            margin-top: 5px;
        }
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
            .dice { width: 70px; height: 70px; font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎲 SIC BO 🎲</h1>
            <div class="header-info">
                <div class="info-item">Solde: <strong id="balance">0.00 CDF</strong></div>
            </div>
        </div>

        <div class="main-content">
            <div class="game-section">
                <div class="game-title">🎰 Lancé des dés</div>
                
                <div class="dice-display" id="diceDisplay">
                    <div id="dice1" class="dice">?</div>
                    <div id="dice2" class="dice">?</div>
                    <div id="dice3" class="dice">?</div>
                </div>

                <div class="total-display" id="totalDisplay" style="display: none;">
                    Total: <strong id="totalValue">0</strong>
                </div>

                <div class="result-message" id="resultMessage" style="display: none;"></div>
            </div>

            <div class="control-panel">
                <div class="control-title">⚙️ Contrôles</div>

                <div class="control-group">
                    <label class="control-label" for="betAmount">Montant à miser</label>
                    <input type="number" id="betAmount" value="100" min="1" max="10000" step="10">
                </div>

                <div class="control-group">
                    <label class="control-label" for="betType">Type de pari</label>
                    <select id="betType">
                        <option value="small">Petit (4-10)</option>
                        <option value="big">Grand (11-17)</option>
                        <option value="odd">Impair</option>
                        <option value="even">Pair</option>
                        <option value="triple">Triple</option>
                        <option value="pair">Paire</option>
                        <option>--- Dé simple ---</option>
                        <option value="single_1">Dé 1</option>
                        <option value="single_2">Dé 2</option>
                        <option value="single_3">Dé 3</option>
                        <option value="single_4">Dé 4</option>
                        <option value="single_5">Dé 5</option>
                        <option value="single_6">Dé 6</option>
                        <option>--- Total ---</option>
                        <option value="total_4">Total 4</option>
                        <option value="total_5">Total 5</option>
                        <option value="total_6">Total 6</option>
                        <option value="total_7">Total 7</option>
                        <option value="total_8">Total 8</option>
                        <option value="total_9">Total 9</option>
                        <option value="total_10">Total 10</option>
                        <option value="total_11">Total 11</option>
                        <option value="total_12">Total 12</option>
                        <option value="total_13">Total 13</option>
                        <option value="total_14">Total 14</option>
                        <option value="total_15">Total 15</option>
                        <option value="total_16">Total 16</option>
                        <option value="total_17">Total 17</option>
                    </select>
                </div>

                <button id="playBtn">Lancer</button>
                <div class="error-message" id="errorMessage"></div>
            </div>
        </div>
    </div>

    <script>
        const apiBase = '/api/sic_bo';
        let currentBalance = 0;

        async function updateBalance() {
            try {
                const response = await fetch('/api/wallet/balance/');
                const data = await response.json();
                currentBalance = parseFloat(data.balance);
                document.getElementById('balance').textContent = currentBalance.toFixed(2) + ' CDF';
                document.getElementById('betAmount').max = Math.floor(currentBalance);
            } catch (error) {
                console.error('Erreur:', error);
            }
        }

        document.getElementById('playBtn').addEventListener('click', async () => {
            const bet = parseFloat(document.getElementById('betAmount').value);
            const betType = document.getElementById('betType').value;
            const error = document.getElementById('errorMessage');
            error.textContent = '';

            if (!betType || betType.startsWith('---')) {
                error.textContent = 'Sélectionnez un type de pari';
                return;
            }
            if (bet <= 0 || bet > currentBalance) {
                error.textContent = 'Mise invalide';
                return;
            }

            try {
                document.getElementById('playBtn').disabled = true;
                document.getElementById('resultMessage').style.display = 'none';

                const response = await fetch(`${apiBase}/games/start_game/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ bet_amount: bet, bet_type: betType })
                });

                const data = await response.json();

                if (!response.ok) {
                    error.textContent = data.error || 'Erreur serveur';
                    document.getElementById('playBtn').disabled = false;
                    return;
                }

                displayResult(data);
                updateBalance();

            } catch (error) {
                error.textContent = 'Erreur: ' + error.message;
                document.getElementById('playBtn').disabled = false;
            }
        });

        function displayResult(game) {
            const [d1, d2, d3] = game.dice;
            document.getElementById('dice1').textContent = d1;
            document.getElementById('dice2').textContent = d2;
            document.getElementById('dice3').textContent = d3;
            document.getElementById('totalValue').textContent = game.total;
            document.getElementById('totalDisplay').style.display = 'block';

            const msg = document.getElementById('resultMessage');
            if (game.result === 'win') {
                msg.textContent = `🎉 Gagné! Gain: ${parseFloat(game.winnings).toFixed(2)} CDF`;
                msg.className = 'result-message result-win';
            } else {
                msg.textContent = 'Perdu!';
                msg.className = 'result-message result-lose';
            }
            msg.style.display = 'block';
            document.getElementById('playBtn').disabled = false;
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        updateBalance();
    </script>
</body>
</html>
