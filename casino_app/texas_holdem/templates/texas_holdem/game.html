<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em - Jeu de Casino</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .header-info {
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .info-item { padding: 10px 20px; background: rgba(0,0,0,0.3); border-radius: 8px; }
        .info-item strong { color: #00d4ff; }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 30px;
        }
        .game-section {
            background: rgba(15, 52, 96, 0.8);
            border: 2px solid #0f3460;
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        .game-title { font-size: 1.3em; margin-bottom: 25px; color: #00d4ff; }
        .cards-section {
            margin: 30px 0;
        }
        .cards-row {
            margin-bottom: 25px;
        }
        .cards-label {
            color: #00d4ff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .cards-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .card {
            width: 60px;
            height: 90px;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            border: 2px solid #0f3460;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .best-hand-section {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .best-hand-title { color: #ffd700; font-weight: bold; margin-bottom: 10px; }
        .hand-rank { color: #90EE90; font-size: 1.1em; margin-bottom: 10px; }
        .result-message {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            margin: 20px 0;
        }
        .result-win {
            background: rgba(40, 167, 69, 0.3);
            border: 2px solid #28a745;
            color: #90EE90;
        }
        .result-lose {
            background: rgba(220, 53, 69, 0.3);
            border: 2px solid #dc3545;
            color: #ff6b6b;
        }
        .control-panel {
            background: rgba(15, 52, 96, 0.8);
            border: 2px solid #0f3460;
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            height: fit-content;
        }
        .control-title { color: #00d4ff; font-size: 1.1em; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; }
        .control-group { margin-bottom: 20px; }
        .control-label {
            display: block;
            color: #ccc;
            margin-bottom: 8px;
            font-size: 0.85em;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            background: #1a3a52;
            border: 2px solid #0f3460;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95em;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.9em;
        }
        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #0056b3, #003580);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.4);
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
            .cards-display { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🃏 TEXAS HOLD'EM 🃏</h1>
            <div class="header-info">
                <div class="info-item">Solde: <strong id="balance">0.00 CDF</strong></div>
            </div>
        </div>

        <div class="main-content">
            <div class="game-section">
                <div class="game-title">🎰 Distribution des Cartes</div>
                
                <div class="cards-section">
                    <div class="cards-row">
                        <div class="cards-label">Vos Cartes Privées (Hole Cards)</div>
                        <div class="cards-display" id="holeCards">
                            <div class="card">?</div>
                            <div class="card">?</div>
                        </div>
                    </div>
                    
                    <div class="cards-row">
                        <div class="cards-label">Cartes Communes (Community Cards)</div>
                        <div class="cards-display" id="communityCards">
                            <div class="card">?</div>
                            <div class="card">?</div>
                            <div class="card">?</div>
                            <div class="card">?</div>
                            <div class="card">?</div>
                        </div>
                    </div>
                </div>

                <div class="best-hand-section" id="bestHandSection" style="display: none;">
                    <div class="best-hand-title">Votre Meilleure Main</div>
                    <div class="hand-rank" id="handRank">-</div>
                    <div class="cards-display" id="bestHandCards"></div>
                </div>

                <div class="result-message" id="resultMessage" style="display: none;"></div>
            </div>

            <div class="control-panel">
                <div class="control-title">⚙️ Contrôles</div>

                <div class="control-group">
                    <label class="control-label" for="betAmount">Montant à miser</label>
                    <input type="number" id="betAmount" value="50" min="1" max="10000" step="10">
                </div>

                <button id="playBtn">Jouer</button>
            </div>
        </div>
    </div>

    <script>
        const apiBase = '/api/texas_holdem';
        let currentBalance = 0;

        async function updateBalance() {
            try {
                const response = await fetch('/api/wallet/balance/');
                const data = await response.json();
                currentBalance = parseFloat(data.balance);
                document.getElementById('balance').textContent = currentBalance.toFixed(2) + ' CDF';
                document.getElementById('betAmount').max = Math.floor(currentBalance);
            } catch (error) {
                console.error('Erreur:', error);
            }
        }

        document.getElementById('playBtn').addEventListener('click', async () => {
            const bet = parseFloat(document.getElementById('betAmount').value);
            
            if (bet <= 0 || bet > currentBalance) {
                alert('Mise invalide');
                return;
            }

            try {
                document.getElementById('playBtn').disabled = true;

                const response = await fetch(`${apiBase}/games/start_game/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ bet_amount: bet })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || 'Erreur serveur');
                    document.getElementById('playBtn').disabled = false;
                    return;
                }

                displayResult(data);
                updateBalance();

            } catch (error) {
                alert('Erreur: ' + error.message);
                document.getElementById('playBtn').disabled = false;
            }
        });

        function displayResult(game) {
            const holeDisplay = document.getElementById('holeCards');
            holeDisplay.innerHTML = game.hole_cards.map(card => `<div class="card">${card}</div>`).join('');
            
            const communityDisplay = document.getElementById('communityCards');
            communityDisplay.innerHTML = game.community_cards.map(card => `<div class="card">${card}</div>`).join('');
            
            const bestHandSection = document.getElementById('bestHandSection');
            bestHandSection.style.display = 'block';
            
            document.getElementById('handRank').textContent = `Rang: ${game.hand_rank.replace('_', ' ').toUpperCase()}`;
            
            const bestHandDisplay = document.getElementById('bestHandCards');
            bestHandDisplay.innerHTML = game.best_hand.map(card => `<div class="card">${card}</div>`).join('');

            const msg = document.getElementById('resultMessage');
            if (game.result === 'win') {
                msg.textContent = `🎉 Gagné! Gain: ${parseFloat(game.winnings).toFixed(2)} CDF`;
                msg.className = 'result-message result-win';
            } else {
                msg.textContent = 'Perdu!';
                msg.className = 'result-message result-lose';
            }
            msg.style.display = 'block';
            document.getElementById('playBtn').disabled = false;
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        updateBalance();
    </script>
</body>
</html>
